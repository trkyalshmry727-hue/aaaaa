<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1108">
<title>كورة الصحراء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3d8bff; --red:#ff4b45; --gold:#ffc23d; --ink:#1b1108;
  --glass:rgba(20,12,6,.55); --line:rgba(255,255,255,.18);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1108;color:#fff;font-family:'Cairo',system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;border:0}

/* القائمة */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--st)) calc(16px + var(--sr)) calc(12px + var(--sb)) calc(16px + var(--sl));
  background:linear-gradient(180deg,rgba(30,14,4,.35),rgba(30,14,4,.78));overflow-y:auto;touch-action:pan-y}
.mcard{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:860px;width:100%}
.mleft{flex:1 1 280px;text-align:center}
.mright{flex:1 1 300px;display:flex;flex-direction:column;gap:9px;max-width:380px}
.logo{font-size:54px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(20deg)}}
h1{margin:4px 0 0;font-size:44px;font-weight:900;letter-spacing:0;line-height:1.15;
  background:linear-gradient(180deg,#fff6d8,#ffc23d 60%,#ff8a2b);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(90,35,0,.65))}
.sub{margin:2px 0 12px;opacity:.9;font-weight:700}
label{display:block;font-weight:700;margin-bottom:4px;opacity:.9}
input{font-family:inherit;font-size:18px;font-weight:700;width:100%;padding:10px 14px;border-radius:14px;border:2px solid var(--line);
  background:rgba(0,0,0,.35);color:#fff;outline:none;text-align:center;-webkit-user-select:text;user-select:text}
input:focus{border-color:var(--gold)}
.mbtn{font-size:18px;font-weight:900;color:#fff;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.14);border:2px solid var(--line);
  box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.mbtn.gold{background:linear-gradient(180deg,#ffd35c,#ff9d1c);color:#3a1800;border-color:#ffe39a}
.mbtn.blue{background:linear-gradient(180deg,#5aa2ff,#2f6fe0);border-color:#9cc6ff}
.row{display:flex;gap:8px}
.row input{flex:1}
.row .mbtn{flex:0 0 auto;padding-inline:20px}
#status{min-height:24px;text-align:center;font-weight:700;color:#ffe08a}
.help{font-size:13px;opacity:.85;line-height:1.7;text-align:center;margin-top:6px}

/* واجهة اللعب */
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#score{position:absolute;top:calc(8px + var(--st));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-weight:900;pointer-events:none;white-space:nowrap}
#score .tn{font-size:13px;padding:1px 8px;border-radius:8px}
#score .tb{background:var(--blue)} #score .tr{background:var(--red)}
#score b{font-size:22px;min-width:18px;text-align:center}
#tm{font-size:15px;opacity:.95;min-width:44px;text-align:center;direction:ltr}
#bExit{position:absolute;top:calc(8px + var(--st));right:calc(10px + var(--sr));background:var(--glass);color:#fff;border:1px solid var(--line);
  border-radius:12px;padding:5px 12px;font-weight:700;font-size:14px}
#roomBox{position:absolute;top:calc(8px + var(--st));left:calc(10px + var(--sl));display:flex;gap:6px;align-items:center}
#roomInfo{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:700;font-size:13px;pointer-events:none}
#bShare{background:var(--gold);color:#3a1800;border-radius:12px;padding:5px 10px;font-weight:900;font-size:13px}
#bars{position:absolute;top:calc(46px + var(--st));left:50%;transform:translateX(-50%);width:200px;pointer-events:none}
.bar{height:8px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:4px;border:1px solid rgba(255,255,255,.15)}
.bar i{display:block;height:100%;width:100%;transform-origin:right;background:linear-gradient(90deg,#6dffb0,#22c06d)}
#powBar i{background:linear-gradient(90deg,#ffe066,#ff5a1f)}
#big{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:52px;font-weight:900;pointer-events:none;
  text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 30px rgba(0,0,0,.35);opacity:0;transition:opacity .25s}
#big small{display:block;font-size:20px;font-weight:700}
#big.on{opacity:1;animation:pop .45s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
#toast{position:absolute;top:calc(78px + var(--st));left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);
  padding:5px 14px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

/* عصا التحكم */
#joyzone{position:absolute;left:0;bottom:0;width:46%;height:72%;touch-action:none}
#joyb{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;background:rgba(0,0,0,.22);border:3px solid rgba(255,255,255,.35);
  left:calc(110px + var(--sl));top:calc(100% - 110px - var(--sb));pointer-events:none;transition:opacity .2s;opacity:.55}
#joyb.act{opacity:1;transition:none}
#joyk{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.4)}

/* الأزرار */
.b{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;color:#fff;
  background:rgba(15,10,5,.55);border:3px solid rgba(255,255,255,.55);box-shadow:0 4px 10px rgba(0,0,0,.35);touch-action:none;line-height:1.1;text-align:center}
.b span{font-size:22px;line-height:1}
.b.down{transform:scale(.9);background:rgba(255,255,255,.3)}
#bShoot{width:96px;height:96px;right:calc(26px + var(--sr));bottom:calc(28px + var(--sb));font-size:17px;border-color:#ffd35c;background:rgba(255,140,20,.45)}
#bPass{width:74px;height:74px;right:calc(136px + var(--sr));bottom:calc(22px + var(--sb));font-size:14px;border-color:#9cc6ff}
#bSlide{width:74px;height:74px;right:calc(40px + var(--sr));bottom:calc(138px + var(--sb));font-size:14px;border-color:#ff8f8a}
#bSprint{width:68px;height:68px;right:calc(128px + var(--sr));bottom:calc(112px + var(--sb));font-size:13px;border-color:#7dffb8}
#bCall{width:66px;height:66px;right:calc(212px + var(--sr));bottom:calc(66px + var(--sb));font-size:14px;border-color:#fff}
.cd{opacity:.45}

#endbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(20,10,4,.6)}
#endbox h2{margin:0;font-size:40px;font-weight:900}
#endbox p{margin:0;font-size:20px;font-weight:700}
#endbox .row{gap:10px}

#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#1b1108;font-size:22px;font-weight:900;text-align:center;padding:20px;z-index:20}
#rot div{font-size:64px;animation:spin 1.6s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(90deg)}}
@media (orientation:portrait){ body.playing #rot{display:flex} }
@media (max-height:420px){ h1{font-size:34px} .logo{font-size:40px} .mbtn{padding:9px 12px;font-size:16px} .help{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="mcard">
    <div class="mleft">
      <div class="logo">⚽</div>
      <h1>كورة الصحراء</h1>
      <p class="sub">ثري دي • أونلاين • خمسة ضد خمسة</p>
      <label for="name">اسمك</label>
      <input id="name" maxlength="14" autocomplete="off" placeholder="اكتب اسمك">
      <div class="help">شوت: اضغط مطوّل عشان تقوّي الشوت • زحلقة بدون كورة: تطيّح الخصم وتاخذ منه الكورة • زحلقة مع الكورة: تسرّع وتكسر اللاعبين • اطلب الكورة: تنادي «شوتولي!»</div>
    </div>
    <div class="mright">
      <button class="mbtn gold" id="bQuick">🌐 لعب سريع أونلاين</button>
      <button class="mbtn blue" id="bHost">➕ سوّ غرفة لربعك</button>
      <div class="row">
        <input id="code" inputmode="numeric" maxlength="4" placeholder="رمز الغرفة" autocomplete="off">
        <button class="mbtn" id="bJoin">دخول</button>
      </div>
      <button class="mbtn" id="bBots">🤖 العب ضد البوتات</button>
      <div id="status"></div>
    </div>
  </div>
</div>

<div id="hud" class="hide">
  <div id="score">
    <span class="tn tb">الأزرق</span><b id="sB">0</b>
    <span id="tm">3:00</span>
    <b id="sR">0</b><span class="tn tr">الأحمر</span>
  </div>
  <button id="bExit">✕ خروج</button>
  <div id="roomBox"><div id="roomInfo"></div><button id="bShare" class="hide">📤 شارك</button></div>
  <div id="bars">
    <div class="bar" id="stamBar"><i></i></div>
    <div class="bar hide" id="powBar"><i></i></div>
  </div>
  <div id="big"></div>
  <div id="toast"></div>

  <div id="joyzone"><div id="joyb"><div id="joyk"></div></div></div>
  <div class="b" id="bShoot"><span>⚽</span>شوت</div>
  <div class="b" id="bPass"><span>➜</span>تمرير</div>
  <div class="b" id="bSlide"><span>🦵</span>زحلقة</div>
  <div class="b" id="bSprint"><span>⚡</span>سرعة</div>
  <div class="b" id="bCall"><span>✋</span>اطلب</div>

  <div id="endbox" class="hide">
    <h2 id="endT"></h2>
    <p id="endS"></p>
    <div class="row">
      <button class="mbtn gold" id="bAgain">مباراة جديدة</button>
      <button class="mbtn" id="bMenu2">القائمة</button>
    </div>
  </div>
</div>

<div id="rot"><div>📱</div>لف جوالك بالعرض عشان تلعب</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* كورة الصحراء — لعبة كورة قدم ثري دي أونلاين */
(() => {
'use strict';
const $ = (id) => document.getElementById(id);

/* ================== ثوابت ================== */
const FW = 44, FL = 70, HW = FW / 2, HL = FL / 2;
const GW = 9, GH = 3.2, ND = 2.2, BR = 0.36;
const BX = HW + 2, BZ = HL + 3.2;
const MATCH = 180, NPT = 5, NP = 10;
const PFX = 'korasahra26-';
const PUB_ROOMS = ['pub1', 'pub2', 'pub3'];
const TEAM_NAME = ['الأزرق', 'الأحمر'];
const TEAM_CSS = ['#3d8bff', '#ff4b45'];
const TEAM_COL = [0x2f7fff, 0xe53935];
const GK_COL = [0x22c06d, 0xffb300];
const NUMS = [1, 4, 5, 8, 11];
const FORM = [[0, -HL + 1.4], [-9, -21], [9, -21], [-8, -8], [6, -4]];
const HUMAN_ORDER = [4, 3, 1, 2];
const BOT_NAMES = ['فهد', 'سعود', 'ناصر', 'خالد', 'تركي', 'بندر', 'ماجد', 'سلمان', 'نواف', 'مشعل', 'راكان', 'يزيد', 'فيصل', 'عزام', 'سلطان', 'مهند', 'عبدالله', 'حمد'];
const SKINS = [0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524, 0xffdbac];
const HAIRS = [0x2b1a0e, 0x111111, 0x6b3e1d, 0xc0541b, 0x3a2414, 0xe6c15a];

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const sgn = (t) => (t === 0 ? 1 : -1);
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const r2 = (v) => Math.round(v * 100) / 100;
function lerpAng(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
const BN = BOT_NAMES.slice().sort(() => Math.random() - 0.5);
const botName = (i) => BN[i % BN.length];
const zeroInput = () => ({ mx: 0, mz: 0, sp: 0, sh: 0, pa: 0, sl: 0, ca: 0 });

/* ================== الأصوات ================== */
const SND = {
  ctx: null, noise: null, master: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.7; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
    } catch (e) { this.ctx = null; }
  },
  env(node, t, a, peak, dur) {
    node.gain.setValueAtTime(0.0001, t);
    node.gain.exponentialRampToValueAtTime(peak, t + a);
    node.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },
  tone(f1, f2, dur, vol, type) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    this.env(g, t, 0.005, vol, dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  burst(freq, q, dur, vol, start) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + (start || 0), s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noise; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    this.env(g, t, 0.01, vol, dur); s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  kick(v) { v = clamp(v || 0.4, 0.1, 1); this.tone(160, 45, 0.14, 0.5 * v + 0.1); this.burst(1800, 1, 0.05, 0.25 * v); },
  thud() { this.tone(90, 30, 0.25, 0.6); this.burst(400, 0.8, 0.2, 0.3); },
  whoosh() { this.burst(900, 0.6, 0.3, 0.18); },
  pop() { this.tone(600, 1200, 0.12, 0.25, 'triangle'); },
  whistle(long) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, d = long ? 1.1 : 0.45, o = this.ctx.createOscillator(), l = this.ctx.createOscillator(), lg = this.ctx.createGain(), g = this.ctx.createGain();
    o.frequency.value = 2600; l.frequency.value = 28; lg.gain.value = 160; l.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.02); g.gain.setValueAtTime(0.22, t + d - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); l.start(t); o.stop(t + d + 0.05); l.stop(t + d + 0.05);
  },
  goal() {
    this.burst(1100, 0.4, 2.4, 0.5); this.burst(600, 0.5, 2.0, 0.35, 0.1);
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, f, 0.3, 0.22, 'square'), i * 120));
  },
};

/* ================== حالة المباراة ================== */
let S = null;
let myId = -1;
let running = false;
const LI = zeroInput(); // مدخلات اللاعب المحلي

function newPlayer(id) {
  const team = id < NPT ? 0 : 1, slot = id % NPT;
  return {
    id, team, slot, gk: slot === 0, bot: true, name: botName(id), num: NUMS[slot],
    x: 0, z: 0, vx: 0, vz: 0, rot: team === 0 ? 0 : Math.PI,
    st: 0, stT: 0, stam: 1, slideCd: 0, noTouch: 0, protect: 0, call: 0, charge: 0,
    think: Math.random() * 0.3, passTo: -1, passDelay: 0, holdT: 0,
    input: zeroInput(), prev: null, prevSh: 0, conn: null,
    tx: 0, tz: 0, trot: 0,
  };
}
function newState() {
  const s = {
    players: [], ball: { x: 0, y: BR, z: 0, vx: 0, vy: 0, vz: 0, owner: -1, last: -1, age: 0 },
    score: [0, 0], time: MATCH, phase: 'kickoff', phaseT: 2.4, kickTeam: Math.random() < 0.5 ? 0 : 1,
    ev: [], rosterVer: 0, autoRestart: false, goalTeam: -1,
  };
  for (let i = 0; i < NP; i++) s.players.push(newPlayer(i));
  return s;
}
function placeKickoff() {
  for (const p of S.players) {
    const f = FORM[p.slot], k = sgn(p.team);
    p.x = f[0]; p.z = f[1] * k; p.vx = p.vz = 0; p.st = 0; p.stT = 0; p.charge = 0; p.call = 0; p.passTo = -1;
    p.rot = p.team === 0 ? 0 : Math.PI;
    if (p.team === S.kickTeam && p.slot === 4) { p.x = 0; p.z = -1.1 * k; }
  }
  const b = S.ball;
  Object.assign(b, { x: 0, y: BR, z: 0, vx: 0, vy: 0, vz: 0, owner: -1, last: -1 });
  S.phase = 'kickoff'; S.phaseT = 2.2; S.goalTeam = -1;
}
function restartMatch() {
  S.score = [0, 0]; S.time = MATCH; S.kickTeam = Math.random() < 0.5 ? 0 : 1;
  placeKickoff(); S.ev.push(['r']);
}
function endMatch() { S.phase = 'end'; S.phaseT = 12; S.ball.owner = -1; S.ev.push(['e']); }

/* ================== المحاكاة ================== */
function step(dt) {
  const s = S;
  if (s.phase === 'end') {
    s.phaseT -= dt;
    if (s.autoRestart && s.phaseT <= 0) restartMatch();
    for (const p of s.players) { p.vx *= 0.9; p.vz *= 0.9; }
    return;
  }
  if (s.phase === 'kickoff') { s.phaseT -= dt; if (s.phaseT <= 0) { s.phase = 'play'; s.ev.push(['w']); } }
  else if (s.phase === 'goal') { s.phaseT -= dt; if (s.phaseT <= 0) { if (s.time <= 0) { endMatch(); return; } placeKickoff(); } }
  else if (s.phase === 'play') { s.time -= dt; if (s.time <= 0) { s.time = 0; s.ev.push(['w', 1]); endMatch(); return; } }
  const frozen = s.phase === 'kickoff';
  if (!frozen) for (const p of s.players) if (p.bot) botThink(p, dt);
  for (const p of s.players) updatePlayer(p, dt, frozen);
  separate();
  if (s.phase === 'play') steals(dt);
  updateBall(dt);
}

function updatePlayer(p, dt, frozen) {
  p.slideCd = Math.max(0, p.slideCd - dt); p.noTouch = Math.max(0, p.noTouch - dt);
  p.protect = Math.max(0, p.protect - dt); p.call = Math.max(0, p.call - dt);
  const inp = p.input;
  if (!p.bot) {
    if (!p.prev) p.prev = { pa: inp.pa, sl: inp.sl, ca: inp.ca };
    if (!frozen && S.phase !== 'end') {
      if (inp.pa !== p.prev.pa) actPass(p);
      if (inp.sl !== p.prev.sl) actSlide(p);
      if (inp.ca !== p.prev.ca) actCall(p);
      if (inp.sh) p.charge = Math.min(1, p.charge + dt * 1.25);
      else if (p.prevSh) { actShoot(p, 0.25 + 0.75 * p.charge); p.charge = 0; }
      else p.charge = 0;
    }

function separate() {

function steals(dt) {

}

function scoreGoal(team) {

/* ---------- أفعال اللاعب ---------- */

/* ================== ذكاء البوتات ================== */
function moveTo(p, tx, tz, maxM, allowSprint) {

    const b = S.ball; p.rot = lerpAng(p.rot, Math.atan2(b.x - p.x, b.z - p.z), 0.12);
    return;
  }

  inp.sp = allowSprint && d > 4 && p.stam > 0.3 ? 1 : 0;
}
function chaseRank(p) {
  const b = S.ball, px = b.x + b.vx * 0.2, pz = b.z + b.vz * 0.2;
  const my = Math.hypot(px - p.x, pz - p.z);

  for (const q of S.players) {
    if (q === p || q.team !== p.team || q.gk || q.st === 2) continue;

}

function connectTo(peer, room, timeout) {

  for (const t of [first, 1 - first]) for (const k of HUMAN_ORDER) { const p = S.players[t * NPT + k]; if (p.bot) return p; }
  return null;
}

  p.input = zeroInput(); p.passTo = -1; p.charge = 0; S.rosterVer++;
}

function startHost(peer, room, pub) {

}

    claim(p, String(d.n || 'لاعب'));
    p.conn = conn; conn._pid = p.id; NET.conns.push(conn);
    conn.send({ t: 'w', id: p.id, room: NET.room, pub: NET.pub });
    sendRoster(true);

  } else if (d.t === 'i') {
    const p = conn._pid != null ? S.players[conn._pid] : null;
    if (!p || p.conn !== conn) return;
    const i = p.input;
    i.mx = clamp(+d.mx || 0, -1, 1); i.mz = clamp(+d.mz || 0, -1, 1);

    const p = S.players[conn._pid];

    conn._pid = null;

}
function sendRoster(force) {

  NET.rosterSent = S.rosterVer;
  const msg = { t: 'r', l: S.players.map((p) => [p.name, p.bot ? 0 : 1]) };
  for (const c of NET.conns) { try { c.send(msg); } catch (e) {} }
}
function snapshot() {
  const P = [];
  for (const p of S.players) P.push(r2(p.x), r2(p.z), r2(p.rot), p.st, p.call > 0 ? 1 : 0, Math.round(p.stam * 100));
  const b = S.ball;
  return { t: 's', p: P, b: [r2(b.x), r2(b.y), r2(b.z), r2(b.vx), r2(b.vy), r2(b.vz), b.owner], sc: S.score, tm: Math.ceil(S.time), ph: S.phase, gt: S.goalTeam, ev: NET.netEv };
}

  const msg = snapshot();
  for (const c of NET.conns) { try { c.send(msg); } catch (e) {} }

function startClient(peer, conn, w, room) {

  S = newState(); myId = w.id; S.players[myId].bot = false; S.players[myId].name = playerName();
  for (const p of S.players) { p.tx = p.x; p.tz = p.z; p.trot = p.rot; }
  conn.on('close', () => { if (NET.mode === 'client' && NET.hostConn === conn) backToMenu('انقطع الاتصال بالمضيف'); });
  peer.on('disconnected', () => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} });
  peer.on('error', () => {});

}
function clientData(d) {
  if (!d || !S) return;
  if (d.t === 's') {
    const P = d.p;
    for (let i = 0; i < NP; i++) {
      const p = S.players[i], o = i * 6;
      p.tx = P[o]; p.tz = P[o + 1]; p.trot = P[o + 2]; p.st = P[o + 3]; p.call = P[o + 4]; p.stam = P[o + 5] / 100;
      p.x = p.tx; p.z = p.tz;
    }
    const b = S.ball, B = d.b;
    b.x = B[0]; b.y = B[1]; b.z = B[2]; b.vx = B[3]; b.vy = B[4]; b.vz = B[5]; b.owner = B[6]; b.age = 0;
    S.score = d.sc; S.time = d.tm; S.phase = d.ph; S.goalTeam = d.gt;
    if (d.ev) for (const e of d.ev) handleEvent(e);
  } else if (d.t === 'r') {
    d.l.forEach((r, i) => { const p = S.players[i]; p.name = r[0]; p.bot = !r[1]; });
    S.rosterVer++;

}

  const c = NET.hostConn; if (!c || !c.open) return;

let busy = false;
async function quickPlay() {
  if (busy) return;
  if (!hasPeer()) { status('ما قدرنا نحمّل نظام الأونلاين، تأكد من النت وحدّث الصفحة'); return; }
  busy = true; status('جاري البحث عن مباراة…');
  try {
    let cp = null;
    try { cp = await makePeer(null); } catch (e) { status('ما قدرنا نتصل بالسيرفر، جرّب مرة ثانية'); return; }
    for (const r of PUB_ROOMS) {
      try { const { conn, welcome } = await connectTo(cp, r, 6000); status(''); startClient(cp, conn, welcome, r); return; } catch (e) {}
    }
    try { cp.destroy(); } catch (e) {}
    status('ما لقينا أحد، بنسوي مباراة وننتظر لاعبين…');
    for (const r of PUB_ROOMS) {
      try { const hp = await makePeer(PFX + r); status(''); startHost(hp, r, true); return; }
      catch (e) { if (e.type !== 'unavailable-id') break; }
    }
    status('صار خطأ بالاتصال، جرّب مرة ثانية');
  } finally { busy = false; }
}
async function hostRoom() {
  if (busy) return;
  if (!hasPeer()) { status('ما قدرنا نحمّل نظام الأونلاين، تأكد من النت وحدّث الصفحة'); return; }
  busy = true; status('جاري إنشاء الغرفة…');
  try {
    for (let i = 0; i < 4; i++) {
      const code = String(Math.floor(1000 + Math.random() * 9000));
      try { const hp = await makePeer(PFX + code); status(''); startHost(hp, code, false); return; }
      catch (e) { if (e.type !== 'unavailable-id') break; }
    }
    status('ما قدرنا نسوي غرفة، جرّب مرة ثانية');
  } finally { busy = false; }
}
async function joinRoom(code) {
  if (busy) return;
  code = String(code || '').replace(/[^\d٠-٩]/g, '').replace(/[٠-٩]/g, (c) => '٠١٢٣٤٥٦٧٨٩'.indexOf(c));
  if (code.length !== 4) { status('اكتب رمز الغرفة (٤ أرقام)'); return; }
  if (!hasPeer()) { status('ما قدرنا نحمّل نظام الأونلاين، تأكد من النت وحدّث الصفحة'); return; }
  busy = true; status('جاري الدخول للغرفة ' + code + '…');
  try {
    let cp;
    try { cp = await makePeer(null); } catch (e) { status('ما قدرنا نتصل بالسيرفر، جرّب مرة ثانية'); return; }
    try { const { conn, welcome } = await connectTo(cp, code, 8000); status(''); startClient(cp, conn, welcome, code); }
    catch (e) {
      try { cp.destroy(); } catch (x) {}
      status(e.type === 'full' ? 'الغرفة مليانة' : 'ما لقينا الغرفة، تأكد من الرمز');
    }
  } finally { busy = false; }
}

  document.body.classList.add('playing');
  $('menu').classList.add('hide'); $('hud').classList.remove('hide'); $('endbox').classList.add('hide');
  LI.sh = 0; sprintBtn = 0;
  SND.init();
  try { const el = document.documentElement; if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {}); } catch (e) {}
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
  const t = S.players[myId].team;
  toast('أنت بالفريق ' + TEAM_NAME[t] + ' • رقمك ' + S.players[myId].num);
  if (NET.mode === 'host' && !NET.pub) setTimeout(() => toast('رمز غرفتك: ' + NET.room + ' — أرسله لربعك'), 2800);
  try { localStorage.setItem('kora_name', $('name').value || ''); } catch (e) {}
}
function backToMenu(msg) {
  running = false; netClose();
  document.body.classList.remove('playing');
  $('menu').classList.remove('hide'); $('hud').classList.add('hide');
  myId = -1; S = newState(); S.autoRestart = true; placeKickoff(); cam.snap = true;
  status(msg || '');
}

$('bBots').onclick = () => {
  if (busy) return;
  SND.init(); netClose(); S = newState(); claimLocal(); placeKickoff(); startGame();
};
$('bQuick').onclick = () => { SND.init(); quickPlay(); };
$('bHost').onclick = () => { SND.init(); hostRoom(); };
$('bJoin').onclick = () => { SND.init(); joinRoom($('code').value); };
$('bExit').onclick = () => backToMenu('');
$('bMenu2').onclick = () => backToMenu('');
$('bAgain').onclick = () => { if (NET.mode !== 'client') { restartMatch(); } };
$('bShare').onclick = async () => {
  const url = location.origin + location.pathname + '?room=' + NET.room;
  const text = 'تعال العب معي كورة الصحراء! رمز الغرفة: ' + NET.room;
  try {
    if (navigator.share) { await navigator.share({ title: 'كورة الصحراء', text, url }); return; }
  } catch (e) { return; }
  try { await navigator.clipboard.writeText(text + '\n' + url); toast('انسخ الرابط ✅'); } catch (e) { toast('رمز الغرفة: ' + NET.room); }
};

/* ================== الحلقة الرئيسية ================== */
let last = performance.now(), acc = 0;
function flushEvents() {
  for (const e of S.ev) { handleEvent(e); if (NET.mode === 'host') NET.netEv.push(e); }
  S.ev.length = 0;
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  if (running) readInput();
  if (NET.mode !== 'client') {
    acc += dt; const h = 1 / 60; let n = 0;
    while (acc >= h && n < 8) { step(h); acc -= h; n++; }
    if (n >= 8) acc = 0;
    flushEvents();
    if (NET.mode === 'host') { NET.sendT += dt; if (NET.sendT >= 0.05) { NET.sendT = 0; broadcast(); } }
  } else {
    NET.inT += dt; if (NET.inT >= 0.05) { NET.inT = 0; sendInput(); }
    NET.pingT -= dt;
    if (NET.pingT <= 0) { NET.pingT = 2; try { if (NET.hostConn && NET.hostConn.open) NET.hostConn.send({ t: 'pg', ts: performance.now() }); } catch (e) {} }
  }
  render(dt);
  if (running) updateHUD(dt);
  renderer.render(scene, camera);
}

/* ================== البداية ================== */
try { const n = localStorage.getItem('kora_name'); if (n) $('name').value = n; } catch (e) {}
const qRoom = new URLSearchParams(location.search).get('room');
if (qRoom) { $('code').value = qRoom.slice(0, 4); status('اضغط «دخول» عشان تدخل غرفة ' + qRoom.slice(0, 4)); }
S = newState(); S.autoRestart = true; placeKickoff();
buildWorld(); resize();
try { document.fonts.ready.then(() => { for (const m of MESH) m.label.userData.txt = null; }); } catch (e) {}
requestAnimationFrame(frame);
window.__kora = { get S() { return S; }, NET, get myId() { return myId; }, LI, step };
})();

</script>
